apiVersion: apps/v1
kind: Deployment
metadata:
  name: netology-app
  namespace: app
  labels:
    app: netology-app
spec:
  replicas: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 20%         # Создаем по 1 новому поду за раз (укладываемся в запас ресурсов)
      maxUnavailable: 0     # Приложение должно быть доступно: не гасим старые поды, пока новые не поднимутся
  selector:
    matchLabels:
      app: netology-app
  template:
    metadata:
      labels:
        app: netology-app
    spec:
      containers:
      - name: nginx
        image: nginx:1.19
        ports:
        - containerPort: 80
      - name: multitool
        image: wbitt/network-multitool
        env:
        - name: HTTP_PORT
          value: "8080"
        - name: HTTPS_PORT
          value: "11443"
        ports:
        - containerPort: 8080
        - containerPort: 11443
---
apiVersion: v1
kind: Service
metadata:
  name: netology-app-svc
  namespace: app
spec:
  selector:
    app: netology-app
  ports:
  - name: nginx-port
    protocol: TCP
    port: 80
    targetPort: 80
  - name: multitool-port
    protocol: TCP
    port: 8080
    targetPort: 8080
